name: context gate

# WHAT CI CAN AND CANNOT ENFORCE HERE — read this before trusting a green badge.
#
# A clone of this repo is the LEDGER, not the workspace. The 26 documents `--check` measures live in
# sibling repositories of one home, and this workflow cannot reach all of them: `Projects/knowledge-factory`
# is private, 22 of the 26 recorded commits were never pushed to their remotes, and the `$HOME` root repo
# and `anatomy-lab` have no remote at all. So the full check — the one the Owner runs against the live
# workspace — cannot run here, and a job that faked it would be worse than no job: a gate that is red on
# every push teaches everyone to ignore CI, which is the failure this ledger exists to prevent.
#
# What CI genuinely can enforce is the part true of the published ledger alone:
#   1. the tool passes its own battery (`--self-test`). That battery is hermetic — it plants its lies in
#      mktemp fixtures, not in the live home — and covers the slop detectors, the digest layer, the
#      recovery probe, `--recover`, the ledger's own binding, and the five live-home-guard shapes;
#   2. the gate FAILS CLOSED when the declared surface is absent, and the live-home guard behaves against
#      a real home-shaped checkout. An audit tool that exits 0 when it cannot find its inputs is worse
#      than no audit tool; that is the regression these steps exist to catch.
#
# When the workspace's bound commits are pushed and knowledge-factory is reachable, the second job can
# grow into the real full check against a replica of the home (recipe: round-6 receipt, §8).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: battery (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: syntax
        run: bash -n scripts/context-audit.sh
      - name: battery
        run: scripts/context-audit.sh --self-test

  fail-closed:
    name: gate fails closed without the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default invocation in a bare clone: it must not report anything, least of all a pass.
      - name: a bare clone cannot silently pass
        run: |
          set +e
          out=$(scripts/context-audit.sh --check 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::--check exited 0 in a clone that cannot see the declared surface"
            exit 1
          fi
          if printf '%s\n' "$out" | grep -q 'check: PASS'; then
            echo "::error::--check claimed PASS on a workspace it cannot see"
            exit 1
          fi
          echo "exit=$rc, no PASS — fail-closed holds"

      # A home-shaped checkout with HOME_DIR unnamed: the live-home guard must refuse it, because the run
      # would otherwise measure the runner's home ($HOME) rather than the checkout it belongs to.
      - name: the guard refuses a checkout it does not belong to
        run: |
          set +e
          H="$RUNNER_TEMP/home"
          mkdir -p "$H"
          cp -a "$GITHUB_WORKSPACE" "$H/local"
          out=$("$H/local/scripts/context-audit.sh" --check 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected the guard to refuse with exit 2; got $rc"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -q 'refusing to run'; then
            echo "::error::expected the live-home guard's refusal; got something else"
            exit 1
          fi
          echo "exit=2, refusal — the guard holds against a real checkout"

      # Same checkout, HOME_DIR named (the documented recipe): the pattern is runs, and what it must then
      # say is that the surface is ABSENT — measured, not assumed.
      - name: the gate measures the absent surface and refuses to pass
        run: |
          set +e
          H="$RUNNER_TEMP/home"
          mkdir -p "$H"
          cp -a "$GITHUB_WORKSPACE" "$H/local"
          : > "$H/CONSTITUTION.md"   # no workspace here: stub the one law path so the load path can run
          out=$(HOME_DIR="$H" "$H/local/scripts/context-audit.sh" --check 2>&1)
          rc=$?
          printf '%s\n' "$out" | tail -15

          if [ "$rc" -ne 1 ]; then
            echo "::error::expected exit 1 (surface absent); got $rc"
            exit 1
          fi
          if printf '%s\n' "$out" | grep -q 'check: PASS'; then
            echo "::error::the gate claimed PASS on a surface that is not present"
            exit 1
          fi

          summary=$(printf '%s\n' "$out" | grep -m1 '^check: over_ceiling=')
          case "$summary" in
            *ledger_failures=0*) ;;
            *) echo "::error::the ledger's own binding is not clean in the published repo: $summary"; exit 1 ;;
          esac

          # Every declared document that is not here must be reported MISSING — computed from the
          # declaration, not hard-coded, so a new row cannot age this assertion into a lie.
          absent=0
          while IFS=$'\t' read -r p _; do
            case "$p" in \#*|'') continue ;; esac
            [ -e "$H/$p" ] || absent=$((absent + 1))
          done < context/ceilings.tsv
          got=$(printf '%s\n' "$summary" | sed -n 's/.*missing=\([0-9]*\).*/\1/p')
          if [ "$got" != "$absent" ]; then
            echo "::error::missing=$got but $absent declared document(s) are absent"
            exit 1
          fi

          echo "absent=$absent missing=$got ledger_failures=0 — measured, and refused to pass" >> "$GITHUB_STEP_SUMMARY"
          echo "A full 26-document check needs the workspace (private knowledge-factory, 22 unpushed bound commits). See this workflow's header." >> "$GITHUB_STEP_SUMMARY"
