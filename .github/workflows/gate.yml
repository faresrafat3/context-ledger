name: context gate

# WHAT CI CAN AND CANNOT ENFORCE HERE — read this before trusting a green badge.
#
# A clone of this repo is the LEDGER, not the workspace. The 26 documents `--check` measures live in
# sibling repositories of one home, so a real check needs a REPLICA of that home. The replica job
# delegates to `scripts/ci-replica.sh`, which builds it at the revisions the ledger binds and asserts
# per-row cleanliness — the same script runs on a workstation, so what CI says can be reproduced.
#
# Six of the nine repositories are public and three are private by design. `knowledge-factory` stays
# private because its history holds live bearer tokens (see
# `compliance/2026-09-22-secret-exposure-knowledge-factory.md`); `home-root` and `anatomy-lab` are
# private because the law text and the lab corpus are the Owner's. So the replica job runs in two
# honest modes: with the `LEDGER_PAT` secret it checks all nine and passes only on a real 26/26 PASS;
# without it — forks, or before the secret exists — it checks the six public repositories, names the
# documents it could not check, and never claims a pass it did not earn.
#
# The other two jobs need no secrets and enforce what is true of the published ledger alone: the
# tool's hermetic battery, and the gate FAILING CLOSED when its declared surface is absent (an audit
# tool that exits 0 when it cannot find its inputs is worse than no audit tool).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: battery (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: syntax
        run: |
          bash -n scripts/context-audit.sh
          bash -n scripts/ci-replica.sh
      - name: battery
        run: scripts/context-audit.sh --self-test

  fail-closed:
    name: gate fails closed without the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default invocation in a bare clone: it must not report anything, least of all a pass.
      - name: a bare clone cannot silently pass
        run: |
          set +e
          out=$(scripts/context-audit.sh --check 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::--check exited 0 in a clone that cannot see the declared surface"
            exit 1
          fi
          if printf '%s\n' "$out" | grep -q 'check: PASS'; then
            echo "::error::--check claimed PASS on a workspace it cannot see"
            exit 1
          fi
          echo "exit=$rc, no PASS — fail-closed holds"

      # A home-shaped checkout with HOME_DIR unnamed: the live-home guard must refuse it, because the
      # run would otherwise measure the runner's home ($HOME) rather than the checkout it belongs to.
      - name: the guard refuses a checkout it does not belong to
        run: |
          set +e
          H="$RUNNER_TEMP/home"
          mkdir -p "$H"
          cp -a "$GITHUB_WORKSPACE" "$H/local"
          out=$("$H/local/scripts/context-audit.sh" --check 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected the guard to refuse with exit 2; got $rc"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -q 'refusing to run'; then
            echo "::error::expected the live-home guard's refusal; got something else"
            exit 1
          fi
          echo "exit=2, refusal — the guard holds against a real checkout"

      # Same checkout, HOME_DIR named (the documented recipe): the pattern runs, and what it must then
      # say is that the surface is ABSENT — measured, not assumed.
      - name: the gate measures the absent surface and refuses to pass
        run: |
          set +e
          H="$RUNNER_TEMP/home"
          mkdir -p "$H"
          cp -a "$GITHUB_WORKSPACE" "$H/local"
          : > "$H/CONSTITUTION.md"   # no workspace here: stub the one law path so the load path can run
          out=$(HOME_DIR="$H" "$H/local/scripts/context-audit.sh" --check 2>&1)
          rc=$?
          printf '%s\n' "$out" | tail -15

          if [ "$rc" -ne 1 ]; then
            echo "::error::expected exit 1 (surface absent); got $rc"
            exit 1
          fi
          if printf '%s\n' "$out" | grep -q 'check: PASS'; then
            echo "::error::the gate claimed PASS on a surface that is not present"
            exit 1
          fi

          summary=$(printf '%s\n' "$out" | grep -m1 '^check: over_ceiling=')
          case "$summary" in
            *ledger_failures=0*) ;;
            *) echo "::error::the ledger's own binding is not clean in the published repo: $summary"; exit 1 ;;
          esac

          # Every declared document that is not here must be reported MISSING — computed from the
          # declaration, not hard-coded, so a new row cannot age this assertion into a lie.
          absent=0
          while IFS=$'\t' read -r p _; do
            case "$p" in \#*|'') continue ;; esac
            [ -e "$H/$p" ] || absent=$((absent + 1))
          done < context/ceilings.tsv
          got=$(printf '%s\n' "$summary" | sed -n 's/.*missing=\([0-9]*\).*/\1/p')
          if [ "$got" != "$absent" ]; then
            echo "::error::missing=$got but $absent declared document(s) are absent"
            exit 1
          fi

          echo "absent=$absent missing=$got ledger_failures=0 — measured, and refused to pass" >> "$GITHUB_STEP_SUMMARY"

  full-check:
    name: full check against a replica of the home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ledger

      - name: build the replica at the audited revisions and check it
        env:
          LEDGER_PAT: ${{ secrets.LEDGER_PAT }}
        run: bash ledger/scripts/ci-replica.sh ledger
